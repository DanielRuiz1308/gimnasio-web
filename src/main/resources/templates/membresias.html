<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membresías</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app">

  <aside th:replace="~{fragmentos/layout :: menu('membresias')}"></aside>

  <main class="contenido">
    <div class="encabezado-pagina">
      <h1 class="titulo-pagina">Membresías</h1>
    </div>

    <div class="aviso-ok" th:if="${mensajeOk}" th:text="${mensajeOk}">Listo</div>
    <div class="aviso-error" th:if="${mensajeError}" th:text="${mensajeError}">Error</div>

    <div class="tarjeta">
      <div class="barra-busqueda">
        <input type="search" id="buscador" data-tabla="table.tabla"
               placeholder="Buscar por nombre, documento, tipo o estado (vigente, por vencer, vencida)...">
        <p class="contador" id="contador"
           th:text="${#lists.size(membresias)} + ' registros'">0 registros</p>
      </div>

      <table class="tabla">
        <thead>
        <tr>
          <th>Cliente</th>
          <th>Documento</th>
          <th>Tipo</th>
          <th>Último pago</th>
          <th>Vence</th>
          <th>Días</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${membresias}">
          <td>
            <div class="celda-persona">
              <div class="avatar" th:attr="data-inicial=${#strings.toUpperCase(#strings.substring(m.nombre, 0, 1))}">
                <img th:src="@{/clientes/{id}/foto(id=${m.clienteId})}" alt="" loading="lazy" onerror="this.remove()">
              </div>
              <span th:text="${m.nombre}">Nombre</span>
            </div>
          </td>
          <td th:text="${m.documento}">Documento</td>
          <td th:text="${m.tipo} ?: '—'">Mensual</td>
          <td th:text="${m.fechaPago} ?: '—'">2026-01-01</td>
          <td th:text="${m.fechaVencimiento} ?: '—'">2026-01-31</td>
          <td th:text="${m.diasRestantes == null ? '—' : (m.diasRestantes >= 0 ? m.diasRestantes + ' días' : 'hace ' + (-m.diasRestantes) + ' días')}">—</td>
          <td>
            <span class="etiqueta"
                  th:classappend="${m.estadoVisual == 'Vigente'} ? 'etiqueta-vigente' : (${m.estadoVisual == 'Por vencer'} ? 'etiqueta-porvencer' : (${m.estadoVisual == 'Vencida'} ? 'etiqueta-vencida' : 'etiqueta-sin'))"
                  th:text="${m.estadoVisual}">Vigente</span>
          </td>
          <td class="col-acciones">
            <div class="acciones-fila">
              <a class="enlace-editar" th:href="@{/membresias/{id}/renovar(id=${m.clienteId})}">Renovar</a>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(membresias)}">
          <td colspan="8" class="vacio">Todavía no hay clientes registrados</td>
        </tr>
        <tr id="sin-resultados" hidden>
          <td colspan="8" class="vacio">Ningún cliente coincide con la búsqueda</td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<script th:src="@{/js/buscador.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrenadores</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app">

  <aside th:replace="~{fragmentos/layout :: menu('entrenadores')}"></aside>

  <main class="contenido">
    <div class="encabezado-pagina">
      <h1 class="titulo-pagina">Gestión de Entrenadores</h1>
      <a class="boton" th:href="@{/entrenadores/nuevo}">+ Nuevo entrenador</a>
    </div>

    <div class="aviso-ok" th:if="${mensajeOk}" th:text="${mensajeOk}">Listo</div>
    <div class="aviso-error" th:if="${mensajeError}" th:text="${mensajeError}">Error</div>

    <div class="tarjeta">
      <div class="barra-busqueda">
        <input type="search" id="buscador" data-tabla="table.tabla"
               placeholder="Buscar por nombre, documento, especialidad...">
        <p class="contador" id="contador"
           th:text="${#lists.size(entrenadores)} + ' registros'">0 registros</p>
      </div>

      <table class="tabla">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Teléfono</th>
          <th>Email</th>
          <th>Especialidad</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${entrenadores}">
          <td th:text="${e.id}">1</td>
          <td>
            <div class="celda-persona">
              <div class="avatar" th:attr="data-inicial=${#strings.toUpperCase(#strings.substring(e.nombre, 0, 1))}">
                <img th:src="@{/entrenadores/{id}/foto(id=${e.id})}" alt="" loading="lazy" onerror="this.remove()">
              </div>
              <span th:text="${e.nombre}">Nombre</span>
            </div>
          </td>
          <td th:text="${e.documento}">Documento</td>
          <td th:text="${e.telefono}">Teléfono</td>
          <td th:text="${e.email}">Email</td>
          <td th:text="${e.especialidad}">Especialidad</td>
          <td class="col-acciones">
            <div class="acciones-fila">
              <a class="enlace-editar" th:href="@{/entrenadores/{id}/editar(id=${e.id})}">Editar</a>
              <form th:action="@{/entrenadores/{id}/eliminar(id=${e.id})}" method="post"
                    onsubmit="return confirm('¿Seguro que quieres eliminar este entrenador?');">
                <button type="submit" class="enlace-eliminar">Eliminar</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(entrenadores)}">
          <td colspan="7" class="vacio">Todavía no hay entrenadores registrados</td>
        </tr>
        <tr id="sin-resultados" hidden>
          <td colspan="7" class="vacio">Ningún entrenador coincide con la búsqueda</td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<script th:src="@{/js/buscador.js}"></script>
</body>
</html>

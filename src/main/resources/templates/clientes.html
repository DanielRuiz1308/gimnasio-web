<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app">

  <aside th:replace="~{fragmentos/layout :: menu('clientes')}"></aside>

  <main class="contenido">
    <div class="encabezado-pagina">
      <h1 class="titulo-pagina">Gestión de Clientes</h1>
      <a class="boton" th:href="@{/clientes/nuevo}">+ Nuevo cliente</a>
    </div>

    <div class="aviso-ok" th:if="${mensajeOk}" th:text="${mensajeOk}">Listo</div>
    <div class="aviso-error" th:if="${mensajeError}" th:text="${mensajeError}">Error</div>

    <div class="tarjeta">
      <div class="barra-busqueda">
        <input type="search" id="buscador" data-tabla="table.tabla"
               placeholder="Buscar por nombre, documento, teléfono, email...">
        <p class="contador" id="contador"
           th:text="${#lists.size(clientes)} + ' registros'">0 registros</p>
      </div>

      <table class="tabla">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Teléfono</th>
          <th>Email</th>
          <th>Género</th>
          <th>Fecha de nacimiento</th>
          <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.id}">1</td>
          <td>
            <div class="celda-persona">
              <div class="avatar" th:attr="data-inicial=${#strings.toUpperCase(#strings.substring(c.nombre, 0, 1))}">
                <img th:src="@{/clientes/{id}/foto(id=${c.id})}" alt="" loading="lazy" onerror="this.remove()">
              </div>
              <span th:text="${c.nombre}">Nombre</span>
            </div>
          </td>
          <td th:text="${c.documento}">Documento</td>
          <td th:text="${c.telefono}">Teléfono</td>
          <td th:text="${c.email}">Email</td>
          <td th:text="${c.genero}">M</td>
          <td th:text="${c.fechaNacimiento}">2000-01-01</td>
          <td class="col-acciones">
            <div class="acciones-fila">
              <a class="enlace-editar" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
              <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}" method="post"
                    onsubmit="return confirm('¿Seguro que quieres eliminar este cliente?');">
                <button type="submit" class="enlace-eliminar">Eliminar</button>
              </form>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
          <td colspan="8" class="vacio">Todavía no hay clientes registrados</td>
        </tr>
        <tr id="sin-resultados" hidden>
          <td colspan="8" class="vacio">Ningún cliente coincide con la búsqueda</td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>

</div>

<script th:src="@{/js/buscador.js}"></script>
</body>
</html>
